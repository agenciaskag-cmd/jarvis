<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0a0a; color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 14px 12px; overflow: hidden;
  }
  h1 { font-size: 19px; letter-spacing: 5px; font-weight: 700; }
  h1 span { color: #F26B1D; }
  .status { font-size: 15px; color: #999; margin-top: 3px; min-height: 20px; }
  .origem { font-size: 12px; color: #555; min-height: 16px; }

  .orbe-area { margin: 14px 0 10px; position: relative; width: 120px; height: 120px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .orbe {
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9a55, #F26B1D 55%, #7a2d05);
    box-shadow: 0 0 45px rgba(242, 107, 29, .45);
    transition: all .4s ease;
  }
  .anel { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(242,107,29,.25); }

  body.falando .orbe { animation: pulso .5s ease-in-out infinite; box-shadow: 0 0 70px rgba(242,107,29,.75); }
  body.falando .anel { animation: expandir 1s ease-out infinite; }
  body.pensando .orbe { animation: pulso 1.6s ease-in-out infinite; filter: brightness(1.15); }
  body.pensando .anel { animation: girar 2.4s linear infinite; border-style: dashed; }
  body.desconectado .orbe { filter: grayscale(1) brightness(.5); box-shadow: none; }

  @keyframes pulso { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes expandir { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  @keyframes girar { to { transform: rotate(360deg); } }

  .botao-parar {
    display: none; border: none; border-radius: 20px; padding: 9px 22px;
    background: #2a1508; color: #F26B1D; border: 1px solid #F26B1D66;
    font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; margin-bottom: 8px;
  }
  body.falando .botao-parar { display: block; }

  .historico {
    flex: 1; width: 100%; max-width: 640px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px;
  }
  .fala {
    background: #161616; border: 1px solid #2a2a2a; border-left: 3px solid #F26B1D;
    border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.55;
    color: #ccc; white-space: pre-wrap; word-break: break-word;
  }
  .fala.atual { border-left-color: #22C55E; color: #f5f5f5; background: #191b17; }
  .fala .cabecalho { font-size: 11px; color: #666; margin-bottom: 6px; letter-spacing: .5px; }
  .fala.eu { border-left-color: #22C55E; background: #12190f; }

  .entrada { width: 100%; max-width: 640px; display: flex; gap: 8px; padding-top: 8px; flex-shrink: 0; }
  .entrada input {
    flex: 1; min-width: 0; padding: 11px 15px; border-radius: 22px; border: 1px solid #333;
    background: #161616; color: #f5f5f5; font-size: 15px; outline: none;
  }
  .entrada input:focus { border-color: #F26B1D; }
  .entrada button {
    border: none; border-radius: 22px; padding: 0 16px; font-size: 17px; cursor: pointer;
    background: #232323; color: #f5f5f5; white-space: nowrap;
  }
  .entrada button.mic.gravando { background: #22C55E; }
</style>
</head>
<body>
  <h1>J A R V I S <span>●</span></h1>
  <div class="status" id="status">Conectando...</div>
  <div class="origem" id="origem"></div>

  <div class="orbe-area"><div class="anel"></div><div class="orbe"></div></div>

  <button class="botao-parar" id="botaoParar">Parar de falar</button>

  <div class="historico" id="historico"></div>

  <div class="entrada">
    <input id="campoTexto" type="text" placeholder="Perguntar algo ao Jarvis" autocomplete="off">
    <button class="mic" id="botaoMic" title="Segure para falar">🎙️</button>
    <button id="botaoEnviar">➤</button>
  </div>

<script>
  const corpo = document.body;
  const status = document.getElementById('status');
  const origem = document.getElementById('origem');
  const historico = document.getElementById('historico');
  const campoTexto = document.getElementById('campoTexto');
  const botaoMic = document.getElementById('botaoMic');

  let falaAtualDiv = null;

  function definirEstado(nome, texto) {
    corpo.className = nome;
    status.textContent = texto;
    if (nome !== 'falando') origem.textContent = '';
  }

  function nomeOrigem(caminho) {
    if (!caminho) return '';
    if (caminho === 'painel') return 'Conversa no painel';
    const partes = caminho.split('/');
    return 'Terminal: ' + (partes[partes.length - 1] || caminho);
  }

  function adicionarFala(texto, cabecalho, classe) {
    const div = document.createElement('div');
    div.className = 'fala ' + (classe || '');
    if (cabecalho) {
      const cab = document.createElement('div');
      cab.className = 'cabecalho';
      cab.textContent = cabecalho;
      div.appendChild(cab);
    }
    div.appendChild(document.createTextNode(texto));
    historico.appendChild(div);
    while (historico.children.length > 30) historico.removeChild(historico.firstChild);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  function conectar() {
    const fonte = new EventSource('/api/eventos');
    fonte.onmessage = (e) => {
      const evento = JSON.parse(e.data);
      if (evento.tipo === 'conectado') definirEstado('', 'De olho no terminal');
      if (evento.tipo === 'pensando') definirEstado('pensando', 'Pensando...');
      if (evento.tipo === 'falando') {
        definirEstado('falando', 'Falando');
        origem.textContent = nomeOrigem(evento.origem);
        if (falaAtualDiv) falaAtualDiv.classList.remove('atual');
        const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        falaAtualDiv = adicionarFala(evento.texto, hora + '  ·  ' + nomeOrigem(evento.origem), 'atual');
      }
      if (evento.tipo === 'parado') {
        if (falaAtualDiv) { falaAtualDiv.classList.remove('atual'); falaAtualDiv = null; }
        definirEstado('', 'De olho no terminal');
      }
    };
    fonte.onerror = () => {
      definirEstado('desconectado', 'Jarvis desligado, tentando reconectar...');
      fonte.close();
      setTimeout(conectar, 3000);
    };
  }
  conectar();

  document.getElementById('botaoParar').addEventListener('click', () => fetch('/api/parar', { method: 'POST' }));

  async function enviarTexto() {
    const texto = campoTexto.value.trim();
    if (!texto) return;
    campoTexto.value = '';
    adicionarFala(texto, 'Você', 'eu');
    try {
      await fetch('/api/texto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
      });
    } catch (e) {
      definirEstado('desconectado', 'Falha na conexão com o Jarvis');
    }
  }
  document.getElementById('botaoEnviar').addEventListener('click', enviarTexto);
  campoTexto.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarTexto(); });

  let gravador = null, pedacos = [], tipoAudio = '';
  async function iniciarGravacao() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      tipoAudio = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      gravador = new MediaRecorder(stream, { mimeType: tipoAudio });
      pedacos = [];
      gravador.ondataavailable = (e) => pedacos.push(e.data);
      gravador.onstop = enviarAudio;
      gravador.start();
      botaoMic.classList.add('gravando');
      definirEstado('', 'Ouvindo você...');
    } catch (e) {
      definirEstado('', 'Preciso da permissão do microfone');
    }
  }
  function pararGravacao() {
    if (gravador && gravador.state === 'recording') {
      gravador.stop();
      gravador.stream.getTracks().forEach((t) => t.stop());
    }
    botaoMic.classList.remove('gravando');
  }
  async function enviarAudio() {
    const blob = new Blob(pedacos, { type: tipoAudio });
    if (blob.size < 2000) { definirEstado('', 'Áudio muito curto'); return; }
    definirEstado('pensando', 'Entendendo o áudio...');
    try {
      const resposta = await fetch('/api/conversar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream', 'X-Audio-Type': tipoAudio },
        body: blob
      });
      const dados = await resposta.json();
      if (dados.erro) { adicionarFala(dados.erro, '', ''); definirEstado('', 'De olho no terminal'); }
      else if (dados.pergunta) adicionarFala(dados.pergunta, 'Você', 'eu');
    } catch (e) {
      definirEstado('desconectado', 'Falha na conexão com o Jarvis');
    }
  }
  botaoMic.addEventListener('pointerdown', iniciarGravacao);
  botaoMic.addEventListener('pointerup', pararGravacao);
  botaoMic.addEventListener('pointerleave', pararGravacao);
</script>
</body>
</html>
