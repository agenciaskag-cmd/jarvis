<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #02050c;
    color: #eaf6ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Topo ---------- */
  .topo {
    position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  }
  h1 { font-size: 15px; letter-spacing: 6px; font-weight: 700; color: #dff3ff; text-shadow: 0 0 18px rgba(0,180,255,.6); white-space: nowrap; }
  h1 span { color: #00d0ff; animation: piscar 2.4s ease-in-out infinite; display: inline-block; }
  @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .status { font-size: 13px; color: #7fb0d6; letter-spacing: .5px; white-space: nowrap; }
  body[data-estado="falando"] .status { color: #35d6ff; text-shadow: 0 0 12px rgba(0,190,255,.6); }
  .resumo { font-size: 12px; color: #5f86a8; letter-spacing: .5px; white-space: nowrap; display: flex; gap: 14px; align-items: center; }
  .resumo span { color: #6fd4ff; }
  .resumo b { color: #9fdcff; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Tópicos: um cartão para cada parágrafo da fala, surgindo na hora em que é falado ---------- */
  .topico {
    position: fixed; z-index: 2; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    border-radius: 16px; border: 1px solid rgba(60, 160, 255, .25);
    background: linear-gradient(160deg, rgba(10, 28, 52, .94), rgba(5, 13, 26, .94));
    box-shadow: inset 0 0 22px rgba(0, 120, 255, .07);
    opacity: 0; transition: border-color .4s, box-shadow .4s; will-change: transform, opacity;
  }
  .topico .numero {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center;
    font: 700 14px ui-monospace, Menlo, monospace; color: #8fe2ff;
    background: radial-gradient(circle at 35% 30%, rgba(60, 190, 255, .35), rgba(0, 60, 140, .2));
    border: 1px solid rgba(80, 200, 255, .4); transition: all .4s;
  }
  .topico .texto { min-width: 0; flex: 1; }
  .topico b {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    font-size: 18px; line-height: 1.25; font-weight: 700; color: #f1faff;
  }
  .topico p { font-size: 17px; line-height: 1.35; font-weight: 600; color: #f1faff; min-height: 46px; }
  .topico b + p { font-size: 14.5px; font-weight: 400; margin-top: 6px; }
  .topico.ativo {
    border-color: #35d6ff;
    box-shadow: 0 0 30px rgba(0, 190, 255, .45), inset 0 0 26px rgba(0, 170, 255, .2);
  }
  .topico.ativo .numero { color: #021018; background: #35d6ff; border-color: #bff0ff; box-shadow: 0 0 18px rgba(60, 210, 255, .9); }
  .topico.ativo p { color: #fff; }
  .topico.feito { border-color: rgba(60, 160, 255, .22); }
  .topico.feito b { color: #b7d3ea; }
  .topico.feito p { color: #a9c6de; }

  /* ---------- Doca de controles ---------- */
  .doca {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px; z-index: 3;
    display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 20px;
    background: linear-gradient(180deg, rgba(2, 5, 12, 0), rgba(2, 5, 12, .92) 45%);
  }
  .botao {
    border-radius: 20px; padding: 9px 18px; flex-shrink: 0;
    background: rgba(0, 90, 160, .22); color: #9fdcff; border: 1px solid rgba(60, 170, 255, .5);
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .25s;
    display: flex; align-items: center; gap: 8px;
  }
  .botao svg { width: 13px; height: 13px; fill: currentColor; }
  .botao:hover { color: #fff; border-color: #35d6ff; box-shadow: 0 0 16px rgba(0, 170, 230, .35); }
  .botao.parar { background: rgba(0, 90, 140, .12); color: #46718f; border-color: rgba(70, 130, 180, .3); }
  body[data-estado="falando"] .botao.parar {
    background: rgba(0, 90, 140, .3); color: #35d6ff; border-color: rgba(0, 190, 255, .6);
    box-shadow: 0 0 16px rgba(0, 170, 230, .3);
  }
  .botao.limpar svg { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .velocidade { display: flex; align-items: center; gap: 8px; color: #6f95b5; font-size: 12px; width: 230px; flex-shrink: 1; min-width: 130px; }
  .velocidade output { color: #35d6ff; font-weight: 700; min-width: 38px; text-align: right; font-size: 14px; }
  .velocidade input[type=range] {
    flex: 1; min-width: 0; appearance: none; -webkit-appearance: none; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #0090cc, #123048); outline: none;
  }
  .velocidade input[type=range]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #35d6ff; box-shadow: 0 0 10px rgba(0, 190, 255, .6); cursor: pointer;
  }
  .entrada { display: flex; gap: 6px; flex: 0 1 300px; min-width: 0; }
  .entrada input {
    flex: 1; min-width: 0; padding: 9px 14px; border-radius: 20px;
    border: 1px solid rgba(70, 130, 180, .35);
    background: rgba(8, 20, 34, .8); color: #eaf6ff; font-size: 14px; outline: none;
  }
  .entrada input::placeholder { color: #4a6a86; }
  .entrada input:focus { border-color: #00b6e8; box-shadow: 0 0 14px rgba(0, 170, 230, .2); }
  .entrada button {
    border: 1px solid rgba(70, 130, 180, .3); border-radius: 50%; width: 38px; height: 38px; flex-shrink: 0; cursor: pointer;
    background: rgba(20, 45, 70, .9); color: #cfeaff; display: grid; place-items: center;
  }
  .entrada button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .entrada button.mic.gravando { background: #0aa46a; border-color: #5fe6b0; }

  /* Janela pequena de canto: só o orbe e os controles */
  body[data-modo="compacto"] .topico, body[data-modo="compacto"] .resumo, body[data-modo="compacto"] .limpar { display: none; }
  body[data-modo="compacto"] .topo { height: 30px; justify-content: center; gap: 12px; }
  body[data-modo="compacto"] .doca { height: 44px; gap: 10px; padding: 0 10px; }
  body[data-modo="compacto"] .botao, body[data-modo="vertical"] .botao { padding: 8px 12px; font-size: 13px; }
  body[data-modo="vertical"] .velocidade span, body[data-modo="vertical"] .entrada { display: none; }
  body[data-modo="vertical"] .velocidade { min-width: 80px; }
  body[data-modo="vertical"] .doca { gap: 8px; padding: 0 10px; }
  @media (max-width: 760px) { body[data-modo="compacto"] .entrada { display: none; } }
</style>
</head>
<body data-estado="">
  <canvas id="cena"></canvas>

  <div class="topo">
    <h1>J A R V I S <span>●</span></h1>
    <div class="status" id="status">Conectando...</div>
    <div class="resumo"><span id="contagem"></span><b id="relogio"></b></div>
  </div>

  <div id="mapa"></div>

  <footer class="doca">
    <button class="botao parar" id="botaoParar"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Parar de falar</button>
    <button class="botao" id="botaoRepetir"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z"/></svg>Ouvir de novo</button>
    <button class="botao limpar" id="botaoLimpar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Limpar tela</button>
    <label class="velocidade">
      <span>Velocidade</span>
      <input id="controleVelocidade" type="range" min="1" max="3" step="0.1" value="1">
      <output id="valorVelocidade">1.0x</output>
    </label>
    <div class="entrada">
      <input id="campoTexto" type="text" placeholder="Pergunte ao Jarvis" autocomplete="off">
      <button class="mic" id="botaoMic" title="Segure para falar"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="botaoEnviar" title="Enviar"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
    </div>
  </footer>

<script>
  const corpo = document.body;
  const DEMO = new URLSearchParams(location.search).get('demo') === '1';
  const mapa = document.getElementById('mapa');

  // ---------- Cena ----------
  const cena = document.getElementById('cena');
  const c = cena.getContext('2d');
  let W = 0, H = 0, modo = 'largo';
  const orbe = { x: 0, y: 0, r: 100 };
  let vagas = [];      // lugares em volta do orbe onde os cartões podem surgir
  let topicos = [];    // cartões na tela: um para cada parágrafo da fala
  let larguraCartao = 320;

  function medir() {
    W = window.innerWidth; H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cena.width = W * dpr; cena.height = H * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    modo = H < 430 ? 'compacto' : (W < 900 || W < H ? 'vertical' : 'largo');
    corpo.dataset.modo = modo;
    vagas = [];

    if (modo === 'compacto') {
      orbe.r = Math.min(H * 0.2, W * 0.12);
      orbe.x = W / 2; orbe.y = 30 + (H - 74) / 2;
    } else if (modo === 'largo') {
      // mapa mental: orbe no centro, cartões surgem dos dois lados, de cima para baixo
      orbe.r = Math.min(W * 0.095, H * 0.18);
      orbe.x = W / 2; orbe.y = H * 0.47;
      larguraCartao = Math.min(300, W * 0.235);
      for (let i = 0; i < 8; i++) {
        const lado = i % 2 ? 1 : -1, k = Math.floor(i / 2);
        const x = orbe.x + lado * (W / 2 - 24 - larguraCartao / 2);
        const y = orbe.y + [-0.3, -0.1, 0.1, 0.3][k] * H;
        const ang = [-0.7, -0.22, 0.22, 0.7][k];
        vagas.push({ esquerda: x - larguraCartao / 2, topo: y - 38, ax: x - lado * larguraCartao / 2, ay: y, lado,
          ex: orbe.x + lado * Math.cos(ang) * orbe.r * 1.95, ey: orbe.y + Math.sin(ang) * orbe.r * 1.95 });
      }
    } else {
      // janela em pé: orbe em cima e os cartões empilhados embaixo
      orbe.r = Math.min(W * 0.2, H * 0.1);
      orbe.x = W / 2; orbe.y = 52 + orbe.r * 1.75;
      larguraCartao = W - 24;
      const topo = orbe.y + orbe.r * 2.05, passo = 128, quantas = Math.max(1, Math.floor((H - topo - 60) / passo));
      for (let i = 0; i < quantas; i++) vagas.push({ esquerda: 12, topo: topo + i * passo, lado: 0 });
    }
    for (const tp of topicos) posicionar(tp);
  }

  function posicionar(tp) {
    const vaga = vagas[tp.vaga % Math.max(1, vagas.length)];
    if (!vaga) return;
    tp.lugar = vaga;
    tp.el.style.left = vaga.esquerda + 'px'; tp.el.style.top = vaga.topo + 'px'; tp.el.style.width = larguraCartao + 'px';
  }
  window.addEventListener('resize', medir);
  medir();

  // poeira de fundo
  const poeira = [];
  for (let i = 0; i < 70; i++) poeira.push({ x: Math.random(), y: Math.random(), v: 0.004 + Math.random() * 0.012, t: 0.6 + Math.random() * 1.6, f: Math.random() * 6.28 });

  let rosto = null;                 // foto opcional em public/rosto.jpg
  let estadoOrbe = 'desconectado';  // parado | falando | pensando | desconectado
  let energia = 0, nivel = 0, t = 0;
  let volumes = null, posicaoVoz = 0, ultimoQuadro = performance.now(); // volume real da fala, enviado pelo servidor
  let velocidadeAtual = 1;
  const inicio = performance.now();

  function bezier(v, u) {
    const meioX = (v.ax + v.ex) / 2, w = 1 - u;
    return [
      w * w * w * v.ax + 3 * w * w * u * meioX + 3 * w * u * u * meioX + u * u * u * v.ex,
      w * w * w * v.ay + 3 * w * w * u * v.ay + 3 * w * u * u * v.ey + u * u * u * v.ey
    ];
  }

  // movimento de reserva para quando o servidor não manda o volume da voz
  function voz(tempo) {
    const s = Math.abs(Math.sin(tempo * 9.1) * 0.5 + Math.sin(tempo * 5.3 + 1.7) * 0.3 + Math.sin(tempo * 14.7 + 0.4) * 0.2);
    return Math.min(1, s * 1.6) * (0.65 + 0.35 * Math.sin(tempo * 1.3));
  }

  function desenhar() {
    t += 0.016;
    const quadro = performance.now(), passou = Math.min(0.1, (quadro - ultimoQuadro) / 1000); ultimoQuadro = quadro;
    const agora = (quadro - inicio) / 1000;
    const cinza = estadoOrbe === 'desconectado';
    const cor = cinza ? '150,160,170' : '60,200,255';
    const corForte = cinza ? '200,205,210' : '190,240,255';
    const alvoEnergia = estadoOrbe === 'falando' ? 1 : (estadoOrbe === 'pensando' ? 0.55 : 0.18);
    energia += (alvoEnergia - energia) * 0.06;
    let vozAgora = voz(t);
    if (volumes) {
      posicaoVoz += passou * velocidadeAtual;
      const indice = Math.floor(posicaoVoz / 0.05);
      vozAgora = indice < volumes.length ? Math.sqrt(volumes[indice] / 99) : 0.05;
    }
    const alvoNivel = estadoOrbe === 'falando' ? vozAgora : (estadoOrbe === 'pensando' ? 0.16 + 0.1 * Math.sin(t * 7) : 0.04 + 0.03 * Math.sin(t * 1.6));
    nivel += (alvoNivel - nivel) * 0.45;
    const R = orbe.r, X = orbe.x, Y = orbe.y;
    const ligar = Math.min(1, agora / 0.9); // o orbe "acende" ao abrir

    c.clearRect(0, 0, W, H);

    // fundo: clarão azul atrás do orbe e poeira subindo
    const fundo = c.createRadialGradient(X, Y, R * 0.4, X, Y, Math.max(W, H) * 0.62);
    fundo.addColorStop(0, 'rgba(' + (cinza ? '60,70,80' : '0,90,200') + ',' + (0.2 + energia * 0.16) * ligar + ')');
    fundo.addColorStop(0.45, 'rgba(0,40,110,' + (cinza ? 0 : 0.09) + ')');
    fundo.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = fundo; c.fillRect(0, 0, W, H);
    for (const p of poeira) {
      p.y -= p.v * 0.016 * (1 + energia * 2);
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      c.fillStyle = 'rgba(' + cor + ',' + (0.1 + 0.16 * (0.5 + 0.5 * Math.sin(t * 1.4 + p.f))) + ')';
      c.beginPath(); c.arc(p.x * W, p.y * H, p.t, 0, 6.29); c.fill();
    }

    // ligação do orbe com cada cartão: o raio sai do centro, chega no lugar e o cartão surge na ponta
    if (modo === 'largo') {
      for (const tp of topicos) {
        const v = tp.lugar;
        if (!v || !v.lado) continue;
        const ativo = tp === topicoAtivo;
        const fracao = Math.max(0, Math.min(1, (quadro - tp.nasceu) / 450)) * (tp.saindo ? Math.max(0, 1 - (quadro - tp.saindo) / 400) : 1);
        tp.brilho += ((ativo ? 1 : 0) - tp.brilho) * 0.08;
        if (fracao <= 0) continue;
        c.beginPath();
        for (let s = 0; s <= 28; s++) {
          const ponto = bezier(v, 1 - (s / 28) * fracao);
          s === 0 ? c.moveTo(ponto[0], ponto[1]) : c.lineTo(ponto[0], ponto[1]);
        }
        c.strokeStyle = 'rgba(' + cor + ',' + (0.3 + tp.brilho * 0.55) + ')';
        c.lineWidth = 1.2 + tp.brilho * 1.6;
        c.shadowColor = 'rgba(' + cor + ',.9)'; c.shadowBlur = 4 + tp.brilho * 14;
        c.stroke(); c.shadowBlur = 0;
        // pulsos correndo do orbe para o cartão: vários enquanto o Jarvis fala dele, um só depois
        const quantos = ativo ? 3 : 1, passo = ativo ? 0.8 : 0.14;
        for (let q = 0; q < quantos; q++) {
          const u = fracao < 1 ? 1 - fracao : 1 - ((t * passo + tp.fase + q / quantos) % 1);
          const ponto = bezier(v, u), tam = 2.2 + tp.brilho * 2.6;
          const halo = c.createRadialGradient(ponto[0], ponto[1], 0, ponto[0], ponto[1], tam * 3.2);
          halo.addColorStop(0, 'rgba(255,255,255,' + (0.55 + tp.brilho * 0.45) + ')');
          halo.addColorStop(0.3, 'rgba(' + cor + ',.6)');
          halo.addColorStop(1, 'rgba(' + cor + ',0)');
          c.fillStyle = halo; c.beginPath(); c.arc(ponto[0], ponto[1], tam * 3.2, 0, 6.29); c.fill();
          if (fracao < 1) break;
        }
      }
    }

    c.save();
    c.globalAlpha = ligar;

    // halo do orbe
    const halo = c.createRadialGradient(X, Y, R * 0.8, X, Y, R * 2.3);
    halo.addColorStop(0, 'rgba(' + cor + ',' + (0.3 + nivel * 0.4) + ')');
    halo.addColorStop(1, 'rgba(' + cor + ',0)');
    c.fillStyle = halo; c.beginPath(); c.arc(X, Y, R * 2.3, 0, 6.29); c.fill();

    // barras em volta: sobem e descem com o volume da voz
    const N = 132, base = R * 1.1;
    c.beginPath();
    for (let i = 0; i < N; i++) {
      const ang = (i / N) * 6.2832 - 1.5708, j = i < N / 2 ? i : N - i;
      const ruido = 0.5 + 0.5 * Math.sin(j * 0.55 + t * 5.2) * Math.cos(j * 0.21 - t * 3.3);
      const perfil = 0.55 + 0.45 * Math.pow(Math.sin(j * 1.7 + 0.6), 2);
      const repouso = 0.05 + 0.035 * Math.sin(j * 0.4 + t * 1.8);
      const comp = R * (repouso + nivel * 0.62 * ruido * perfil) * ligar;
      const cs = Math.cos(ang), sn = Math.sin(ang);
      c.moveTo(X + cs * base, Y + sn * base);
      c.lineTo(X + cs * (base + comp), Y + sn * (base + comp));
    }
    const tinta = c.createRadialGradient(X, Y, base, X, Y, base + R * 0.62);
    tinta.addColorStop(0, 'rgba(' + corForte + ',1)');
    tinta.addColorStop(0.5, 'rgba(' + cor + ',.95)');
    tinta.addColorStop(1, cinza ? 'rgba(120,130,140,.6)' : 'rgba(20,110,255,.75)');
    c.strokeStyle = tinta; c.lineWidth = Math.max(1.6, R * 0.021); c.lineCap = 'round';
    c.shadowColor = 'rgba(' + cor + ',1)'; c.shadowBlur = 10 + nivel * 22;
    c.stroke();

    // arcos externos girando
    c.lineWidth = Math.max(1.5, R * 0.016);
    const giroFora = t * (estadoOrbe === 'pensando' ? 1.6 : 0.22 + energia * 0.3);
    [[1.74, 0.9, 1], [1.74, 0.5, 3.4], [1.86, 0.35, 5.2], [1.86, 0.7, 2.1]].forEach((arco, n) => {
      const a0 = arco[2] + giroFora * (n % 2 ? -1 : 1);
      c.strokeStyle = 'rgba(' + cor + ',' + (0.3 + energia * 0.45) + ')';
      c.beginPath(); c.arc(X, Y, R * arco[0] + nivel * R * 0.12, a0, a0 + arco[1]); c.stroke();
    });

    // aro e miolo
    c.strokeStyle = 'rgba(' + corForte + ',.95)'; c.lineWidth = Math.max(2, R * 0.025);
    c.beginPath(); c.arc(X, Y, R * 1.03, 0, 6.29); c.stroke();
    c.shadowBlur = 0;
    c.beginPath(); c.arc(X, Y, R, 0, 6.29); c.closePath();
    c.save(); c.clip();
    const miolo = c.createRadialGradient(X, Y - R * 0.2, R * 0.05, X, Y, R);
    miolo.addColorStop(0, cinza ? '#2a3038' : '#0d3a78');
    miolo.addColorStop(1, '#030914');
    c.fillStyle = miolo; c.fillRect(X - R, Y - R, R * 2, R * 2);
    if (rosto) {
      const escala = Math.max(2 * R / rosto.width, 2 * R / rosto.height);
      c.drawImage(rosto, X - rosto.width * escala / 2, Y - rosto.height * escala / 2, rosto.width * escala, rosto.height * escala);
      c.fillStyle = 'rgba(0,80,200,' + (0.08 + nivel * 0.12) + ')'; c.fillRect(X - R, Y - R, R * 2, R * 2);
    } else {
      const giro = t * (estadoOrbe === 'pensando' ? 1.5 : 0.22 + energia * 0.4);
      c.save(); c.translate(X, Y);
      // varredura tipo radar
      if (c.createConicGradient && !cinza) {
        c.save(); c.rotate(t * 0.9);
        const varre = c.createConicGradient(0, 0, 0);
        varre.addColorStop(0, 'rgba(' + cor + ',0)'); varre.addColorStop(0.8, 'rgba(' + cor + ',0)');
        varre.addColorStop(1, 'rgba(' + cor + ',' + (0.14 + energia * 0.14) + ')');
        c.fillStyle = varre; c.beginPath(); c.arc(0, 0, R * 0.94, 0, 6.29); c.fill();
        c.restore();
      }
      // régua de marcações girando
      c.save(); c.rotate(giro * 0.5);
      c.strokeStyle = 'rgba(' + cor + ',.6)'; c.lineWidth = Math.max(1, R * 0.009); c.lineCap = 'butt'; c.beginPath();
      for (let i = 0; i < 72; i++) {
        const a = (i / 72) * 6.2832, r0 = R * (i % 6 === 0 ? 0.83 : 0.89);
        c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * R * 0.94, Math.sin(a) * R * 0.94);
      }
      c.stroke(); c.restore();
      // anel em três gomos girando ao contrário
      c.save(); c.rotate(-giro);
      c.strokeStyle = 'rgba(' + cor + ',' + (0.45 + energia * 0.45) + ')'; c.lineWidth = R * 0.05; c.lineCap = 'butt';
      c.shadowColor = 'rgba(' + cor + ',.9)'; c.shadowBlur = 6 + nivel * 14;
      for (let g = 0; g < 3; g++) { c.beginPath(); c.arc(0, 0, R * 0.73, g * 2.094 + 0.16, g * 2.094 + 1.6); c.stroke(); }
      c.shadowBlur = 0;
      c.restore();
      c.save(); c.rotate(giro * 0.3);
      c.strokeStyle = 'rgba(' + cor + ',.45)'; c.lineWidth = Math.max(1, R * 0.008);
      c.setLineDash([R * 0.03, R * 0.05]); c.beginPath(); c.arc(0, 0, R * 0.61, 0, 6.29); c.stroke(); c.setLineDash([]);
      c.restore();
      // onda da voz no centro
      const barras = 29, largura = R * 0.92, passoBarra = largura / barras;
      c.lineCap = 'round'; c.lineWidth = passoBarra * 0.5; c.strokeStyle = 'rgba(' + corForte + ',.97)';
      c.shadowColor = 'rgba(' + cor + ',1)'; c.shadowBlur = 8 + nivel * 16; c.beginPath();
      for (let i = 0; i < barras; i++) {
        const u = (i - (barras - 1) / 2) / ((barras - 1) / 2), sino = Math.cos(u * 1.4);
        const mexe = 0.4 + 0.6 * Math.abs(Math.sin(i * 1.3 + t * 7.5) * Math.cos(i * 0.7 - t * 4.1));
        const alturaBarra = R * (0.012 + nivel * 0.34 * sino * mexe);
        c.moveTo(u * largura / 2, -alturaBarra); c.lineTo(u * largura / 2, alturaBarra);
      }
      c.stroke(); c.shadowBlur = 0;
      // estado escrito embaixo da onda
      c.font = '600 ' + Math.max(8, R * 0.08) + 'px ui-monospace, Menlo, monospace';
      c.textAlign = 'center'; c.textBaseline = 'middle'; if ('letterSpacing' in c) c.letterSpacing = Math.round(R * 0.035) + 'px';
      c.fillStyle = 'rgba(' + cor + ',.8)';
      c.fillText({ falando: 'FALANDO', pensando: 'PENSANDO', desconectado: 'DESLIGADO' }[estadoOrbe] || 'ONLINE', R * 0.018, R * 0.45);
      c.restore();
    }
    c.restore();
    c.restore();

    // cartões surgem com um salto logo depois que o raio chega; ao limpar, somem encolhendo
    for (const tp of topicos) {
      let visivel, escala;
      if (tp.saindo) { visivel = Math.max(0, 1 - (quadro - tp.saindo) / 350); escala = 0.8 + 0.2 * visivel; }
      else {
        const p = Math.max(0, Math.min(1, (quadro - tp.nasceu - 300) / 480)), volta = p - 1;
        visivel = Math.min(1, p * 2); escala = 0.6 + 0.4 * (1 + 2.6 * volta * volta * volta + 1.6 * volta * volta);
      }
      if (visivel !== tp.visivel) { tp.visivel = visivel; tp.el.style.opacity = visivel; tp.el.style.transform = 'scale(' + escala.toFixed(3) + ')'; }
    }

    // texto do cartão sendo "digitado" no ritmo da fala
    if (digitando) {
      digitando.mostrado = Math.min(digitando.texto.length, digitando.mostrado + passou * 30 * velocidadeAtual);
      const n = Math.floor(digitando.mostrado);
      if (n !== digitando.ultimo) { digitando.ultimo = n; digitando.alvo.textContent = digitando.texto.slice(0, n); }
      if (n >= digitando.texto.length) digitando = null;
    }
    requestAnimationFrame(desenhar);
  }

  // ---------- Tópicos ----------
  const status = document.getElementById('status');
  const contagem = document.getElementById('contagem');
  const campoTexto = document.getElementById('campoTexto');
  const botaoMic = document.getElementById('botaoMic');
  let digitando = null, topicoAtivo = null, proximaVaga = 0;

  function tique() {
    document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  tique(); setInterval(tique, 15000);

  function definirEstado(nome, texto) {
    corpo.dataset.estado = nome;
    estadoOrbe = nome || 'parado';
    status.textContent = texto;
  }

  function retirar(tp) {
    tp.saindo = performance.now();
    setTimeout(() => { tp.el.remove(); topicos = topicos.filter((outro) => outro !== tp); }, 450);
  }

  function limparTela() {
    if (digitando) digitando = null;
    topicoAtivo = null; proximaVaga = 0;
    topicos.forEach(retirar);
    contagem.textContent = '';
  }

  function concluirAtivo() {
    if (digitando) { digitando.alvo.textContent = digitando.texto; digitando = null; }
    if (topicoAtivo) { topicoAtivo.el.classList.remove('ativo'); topicoAtivo.el.classList.add('feito'); }
    topicoAtivo = null;
  }

  // um parágrafo da fala começou: o cartão dele surge na próxima vaga em volta do orbe
  function abrirTopico(evento) {
    concluirAtivo();
    if (vagas.length === 0) return;
    const vaga = proximaVaga++ % vagas.length;
    topicos.filter((tp) => tp.vaga === vaga && !tp.saindo).forEach(retirar); // fala longa: o cartão mais antigo cede o lugar
    const el = document.createElement('div');
    el.className = 'topico ativo';
    const numero = document.createElement('div'); numero.className = 'numero';
    numero.textContent = String(evento.indice + 1).padStart(2, '0');
    const texto = document.createElement('div'); texto.className = 'texto';
    if (evento.titulo) { const titulo = document.createElement('b'); titulo.textContent = evento.titulo; texto.appendChild(titulo); }
    el.appendChild(numero); el.appendChild(texto);
    mapa.appendChild(el);
    const tp = { el, vaga, fase: Math.random(), brilho: 0, nasceu: performance.now(), saindo: 0 };
    topicos.push(tp);
    posicionar(tp);
    if (evento.texto) {
      const paragrafo = document.createElement('p');
      texto.appendChild(paragrafo);
      digitando = { alvo: paragrafo, texto: evento.texto, mostrado: -10, ultimo: -1 }; // começa depois que o cartão surgiu
    }
    topicoAtivo = tp;
    contagem.textContent = 'Tópico ' + (evento.indice + 1) + ' de ' + evento.total;
  }

  function receber(evento) {
    if (evento.tipo === 'conectado') {
      definirEstado('', 'Online');
      if (evento.velocidade) {
        velocidadeAtual = evento.velocidade;
        controleVelocidade.value = evento.velocidade;
        valorVelocidade.textContent = evento.velocidade.toFixed(1) + 'x';
      }
      if (evento.rosto && !rosto) { const foto = new Image(); foto.onload = () => { rosto = foto; }; foto.src = '/rosto.jpg'; }
    }
    if (evento.tipo === 'pensando') definirEstado('pensando', 'Pensando...');
    if (evento.tipo === 'falando') {
      limparTela(); // fala nova, mapa novo
      definirEstado('falando', 'Falando');
    }
    if (evento.tipo === 'topico') abrirTopico(evento);
    if (evento.tipo === 'trecho') { volumes = evento.envelope && evento.envelope.length ? evento.envelope : null; posicaoVoz = 0; }
    if (evento.tipo === 'parado') {
      concluirAtivo();
      volumes = null;
      definirEstado('', 'Online');
    }
  }

  function conectar() {
    const fonte = new EventSource('/api/eventos');
    fonte.onmessage = (e) => receber(JSON.parse(e.data));
    fonte.onerror = () => {
      definirEstado('desconectado', 'Jarvis desligado, tentando reconectar...');
      fonte.close();
      setTimeout(conectar, 3000);
    };
  }

  desenhar();

  if (DEMO) {
    // só para conferir o visual sem som: repete uma fala de exemplo
    const roteiro = [
      [900, { tipo: 'conectado', velocidade: 1 }],
      [1800, { tipo: 'pensando' }],
      [2800, { tipo: 'falando', total: 5 }],
      [2900, { tipo: 'topico', indice: 0, total: 5, texto: 'Esta é uma demonstração do painel.' }],
      [5200, { tipo: 'topico', indice: 1, total: 5, texto: 'A cada trecho da fala surge um balão novo ligado ao centro.' }],
      [7500, { tipo: 'topico', indice: 2, total: 5, texto: 'Cada balão traz uma ideia só, inteira, sem cortar o texto.' }],
      [9800, { tipo: 'topico', indice: 3, total: 5, texto: 'O que está sendo falado fica aceso.' }],
      [12100, { tipo: 'topico', indice: 4, total: 5, texto: 'Os anteriores continuam na tela, formando o mapa da conversa.' }],
      [15500, { tipo: 'parado' }]
    ];
    const rodar = () => { roteiro.forEach(([quando, ev]) => setTimeout(() => receber(ev), quando)); setTimeout(rodar, 19000); };
    rodar();
  } else conectar();

  // ---------- Controles ----------
  document.getElementById('botaoParar').addEventListener('click', () => fetch('/api/parar', { method: 'POST' }));
  document.getElementById('botaoLimpar').addEventListener('click', limparTela);
  document.getElementById('botaoRepetir').addEventListener('click', async () => {
    try {
      const dados = await (await fetch('/api/repetir', { method: 'POST' })).json();
      if (!dados.ok) status.textContent = 'Ainda não há fala para repetir';
    } catch (e) {}
  });

  const controleVelocidade = document.getElementById('controleVelocidade');
  const valorVelocidade = document.getElementById('valorVelocidade');
  let esperaVelocidade = null;
  controleVelocidade.addEventListener('input', () => {
    const v = Number(controleVelocidade.value);
    velocidadeAtual = v;
    valorVelocidade.textContent = v.toFixed(1) + 'x';
    clearTimeout(esperaVelocidade);
    esperaVelocidade = setTimeout(() => {
      fetch('/api/velocidade', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ valor: v })
      });
    }, 250);
  });

  async function enviarTexto() {
    const texto = campoTexto.value.trim();
    if (!texto) return;
    campoTexto.value = '';
    try {
      await fetch('/api/texto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
      });
    } catch (e) {
      definirEstado('desconectado', 'Falha na conexão com o Jarvis');
    }
  }
  document.getElementById('botaoEnviar').addEventListener('click', enviarTexto);
  campoTexto.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarTexto(); });

  let gravador = null, pedacos = [], tipoAudio = '';
  async function iniciarGravacao() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      tipoAudio = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      gravador = new MediaRecorder(stream, { mimeType: tipoAudio });
      pedacos = [];
      gravador.ondataavailable = (e) => pedacos.push(e.data);
      gravador.onstop = enviarAudio;
      gravador.start();
      botaoMic.classList.add('gravando');
      definirEstado('', 'Ouvindo você...');
    } catch (e) {
      definirEstado('', 'Preciso da permissão do microfone');
    }
  }
  function pararGravacao() {
    if (gravador && gravador.state === 'recording') {
      gravador.stop();
      gravador.stream.getTracks().forEach((faixa) => faixa.stop());
    }
    botaoMic.classList.remove('gravando');
  }
  async function enviarAudio() {
    const blob = new Blob(pedacos, { type: tipoAudio });
    if (blob.size < 2000) { definirEstado('', 'Áudio muito curto'); return; }
    definirEstado('pensando', 'Entendendo o áudio...');
    try {
      const resposta = await fetch('/api/conversar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream', 'X-Audio-Type': tipoAudio },
        body: blob
      });
      const dados = await resposta.json();
      if (dados.erro) definirEstado('', dados.erro);
    } catch (e) {
      definirEstado('desconectado', 'Falha na conexão com o Jarvis');
    }
  }
  botaoMic.addEventListener('pointerdown', iniciarGravacao);
  botaoMic.addEventListener('pointerup', pararGravacao);
  botaoMic.addEventListener('pointerleave', pararGravacao);
</script>
